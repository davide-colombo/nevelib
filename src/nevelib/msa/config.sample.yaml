# nevelib msa module configuration
# Usage: nevelib-msa config.yaml

# --- Input ---
input:
  seed_fasta: "/path/to/seed_viral_cores.fasta"  # Seed sequences for MAFFT
  add_fasta: "/path/to/additional_viral_cores.fasta"  # Optional addfragments FASTA

# --- Output ---
output:
  dir: "./msa_output"                             # Output directory (created if absent)
  alignment_fasta: "viral_cores.aln.fasta"        # Alignment output filename

# --- MAFFT execution ---
mafft:
  threads: 4
  seed_n: 20                                       # Stage-06 seed subset size hint
  extra_args: []                                   # Additional MAFFT arguments

# --- Viral coherence metrics ---
viral:
  min_core_len: 80                                 # Minimum viral-core length included in metrics
  occupancy_p: 0.60                                # Shared-span occupancy threshold

# --- Thresholds (Stage 06 style) ---
thresholds:
  viral_shared_span_min_bp: 80
  viral_median_identity_min: 0.80
  viral_frac_core_ge_min: 0.60
  flank_modal_frac_min: 0.70
  insertion_modal_frac_min: 0.60
  te_cov_high: 0.50

# --- Compression ---
compression:
  compressor: "pigz"
  threads: 4
  level: 6
  fallback: "gzip"

# --- Validation ---
validation:
  skip_input: false
  skip_output: false
  strict: true

# --- External tools ---
tools:
  mafft: "mafft"
  minimap2: "minimap2"
  blastn: "blastn"
  pigz: "pigz"
  gzip: "gzip"
