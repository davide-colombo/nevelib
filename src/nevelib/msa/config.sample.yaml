# nevelib msa module configuration
# Usage: nevelib-msa config.yaml

# --- Input ---
input:
  fasta: "/path/to/sequences.fasta"     # Primary input FASTA (required)
  add_fasta: null                        # Additional sequences to add to seed alignment (optional)

# --- Output ---
output:
  dir: "./msa_output"                    # Output directory (created if absent)
  alignment_filename: "alignment.fasta"  # Output aligned FASTA filename
  metrics_filename: "alignment_metrics.tsv"  # Output metrics filename

# --- MAFFT parameters ---
mafft:
  exec: "mafft"                          # MAFFT binary name or path
  threads: 4                             # Number of threads
  auto: true                             # Use --auto mode for strategy selection
  extra_args: null                       # Additional MAFFT CLI arguments (list of strings)

# --- Alignment quality metrics ---
metrics:
  enabled: true                          # Compute alignment quality metrics
  occupancy_threshold: 0.5               # Min fraction of non-gap chars for a column to be "occupied"
  min_identity: 0.7                      # Min mean pairwise identity to pass
  min_coverage: 0.5                      # Min mean coverage to pass
  min_seq_length: 0                      # Min original sequence length for coverage calculation

# --- Validation ---
validation:
  skip_input: false                      # Skip input FASTA validation
  skip_output: false                     # Skip output validation
  strict: true                           # Raise on warnings
