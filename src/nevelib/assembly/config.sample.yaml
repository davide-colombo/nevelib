# nevelib assembly module configuration
# Usage: nevelib-assembly config.yaml

input:
  r1: "/path/to/R1.fastq.gz"
  r2: "/path/to/R2.fastq.gz"
  singleton: null                        # Optional singleton reads

output:
  dir: "./assembly_output"

normalization:
  enabled: true
  bbnorm: "bbnorm.sh"
  target_coverage: 100
  min_depth: 5
  threads: 8
  memory: "8g"
  seed: null                           # Optional reproducibility seed for BBNorm
  extra_args: null

assembly:
  spades: "spades.py"
  kmers: null                            # null = SPAdes auto-select
  threads: 8
  memory: 16                             # GB
  careful: true
  only_assembler: false
  extra_args: null

coverage_filter:
  enabled: true
  samtools: "samtools"
  minimap2: "minimap2"
  mosdepth: "mosdepth"
  threads: 8
  min_mean_coverage: 5.0
  minimap2_preset: "sr"
  mosdepth_window: 100

deduplication:
  enabled: true
  blastn: "blastn"
  makeblastdb: "makeblastdb"
  evalue: 1e-20
  task: "megablast"
  word_size: 28
  perc_identity: 100.0
  qcov_hsp_perc: 100.0
  max_target_seqs: 100
  threads: 8
  extra_args: null

compression:
  compressor: "pigz"
  threads: 4
  level: 6
  fallback: "gzip"

validation:
  skip_input: false
  skip_output: false
  strict: true
