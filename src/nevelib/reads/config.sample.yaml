input:
  bam: "/path/to/input.bam"
output:
  dir: "./reads_output"
extraction:
  samtools: "samtools"
  threads: 8
  extract_unmapped: true
  extract_supplementary: false
  include_secondary: false
  mapq_min: 0
trimming:
  enabled: true
  fastp: "fastp"
  threads: 8
  qualified_quality_phred: 20
  min_length: 50
  detect_adapter_for_pe: true
  extra_args: null
qc:
  enabled: true
  tool: "fastqc"
  fastqc: "fastqc"
  threads: 4
compression:
  compressor: "pigz"
  threads: 4
  level: 6
  fallback: "gzip"
validation:
  skip_input: false
  skip_output: false
  strict: true
