# nevelib clustering module configuration
# Usage: nevelib-clustering config.yaml

# --- Input ---
input:
  fasta: "/path/to/sequences.fasta"   # Input FASTA (nucleotide or protein)

# --- Output ---
output:
  dir: "./clustering_output"           # Output directory (created if absent)
  prefix: "linclust"                   # MMseqs2 output prefix

# --- MMseqs2 parameters ---
mmseqs:
  exec: "mmseqs"                       # MMseqs2 binary name or path
  min_seq_id: 0.9                      # Minimum sequence identity (0.0-1.0)
  coverage: 0.8                        # Minimum coverage (0.0-1.0)
  cov_mode: 0                          # Coverage mode (0=bidirectional, 1=target, 2=query, 3=target-in-query)
  alignment_mode: 3                    # Alignment mode (3=full alignment)
  threads: 4                           # Number of threads
  min_aln_len: 0                       # Minimum alignment length (0=no filter)
  split_memory_limit: null             # Memory limit for split (e.g., "260G", null=no limit)
  tmp_dir_name: "mmseqs_tmp"           # Temporary directory name

# --- Resume ---
resume: false                          # If true, reuse existing cluster TSV if valid

# --- Validation ---
validation:
  skip_input: false                    # Skip input FASTA validation
  skip_output: false                   # Skip output validation
  strict: true                         # Raise on warnings (false = log and continue)
