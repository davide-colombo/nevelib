# nevelib mapping module configuration
# Usage: nevelib-mapping config.yaml

# --- Input ---
input:
  query: "/path/to/query.fasta"         # Query sequences (FASTA)
  reference: "/path/to/reference.fasta"  # Reference sequences (FASTA)

# --- Output ---
output:
  dir: "./mapping_output"                # Output directory (created if absent)
  paf_filename: "alignments.paf"        # PAF output filename
  summary_filename: "alignment_summary.tsv"  # Best-hit summary TSV filename

# --- minimap2 parameters ---
minimap2:
  exec: "minimap2"                       # minimap2 binary name or path
  threads: 4                             # Number of threads
  preset: "asm5"                         # Preset: 'map-ont', 'asm5', 'asm10', 'sr', etc. (null = no preset)
  extra_args: null                       # Additional CLI arguments (list of strings)
  output_format: "paf"                   # Output format: 'paf' or 'sam'

# --- Post-alignment filtering ---
filtering:
  min_mapq: null                         # Minimum mapping quality (null = no filter)
  min_aln_len: null                      # Minimum alignment length (null = no filter)
  min_nmatch: null                       # Minimum matching bases (null = no filter)
  min_identity: null                     # Minimum identity nmatch/aln_len (null = no filter)

# --- Validation ---
validation:
  skip_input: false                      # Skip input FASTA validation
  skip_output: false                     # Skip output validation
  strict: true                           # Raise on warnings
