# nevelib search module configuration
# Usage: nevelib-search config.yaml

# --- Input ---
input:
  fasta: "/path/to/query.fasta"       # Query sequences (FASTA)

# --- Output ---
output:
  dir: "./search_output"               # Output directory (created if absent)

# --- BLAST parameters ---
blast:
  program: "blastn"                    # BLAST program: 'blastn' or 'blastx'
  db_prefix: "/path/to/blast_db"      # BLAST database prefix
  evalue: 1e-5                         # E-value threshold
  max_target_seqs: 10                  # Maximum target sequences per query
  perc_identity: null                  # Minimum percent identity (null = no filter)
  threads: 4                           # Number of threads
  outfmt_fields: null                  # Custom outfmt 6 fields (null = default 14 fields)
  extra_args: null                     # Additional BLAST CLI arguments (list of strings)
  db_type: "nucl"                      # Database type: 'nucl' or 'prot'
  require_taxonomy: false              # Require taxonomy sidecar files

# --- Post-BLAST filtering ---
filtering:
  min_pident: null                     # Minimum percent identity (null = no filter)
  min_length: null                     # Minimum alignment length (null = no filter)
  max_evalue: null                     # Maximum E-value (null = no filter)
  min_bitscore: null                   # Minimum bitscore (null = no filter)

# --- Taxonomic classification (optional) ---
classification:
  enabled: false                       # Enable taxonomy-based classification
  taxonomy_col: "staxids"             # Column containing taxonomy IDs
  rule: "majority"                     # Classification rule: 'majority', 'any', 'all'
  keywords: []                         # Keywords for positive classification
  keyword_fallback: false              # Fall back to title keyword matching
  bitscore_top_fraction: 0.9           # Keep hits within this fraction of top bitscore

# --- Validation ---
validation:
  skip_input: false                    # Skip input validation
  skip_output: false                   # Skip output validation
  strict: true                         # Raise on warnings

# --- External tools ---
tools:
  blastn: "blastn"
  blastx: "blastx"
  makeblastdb: "makeblastdb"
