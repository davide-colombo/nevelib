[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nevelib"
version = "0.5.0"
description = "A modular bioinformatics library for genomic sequence analysis: read extraction, assembly, homology search, clustering, multiple sequence alignment, and read mapping."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Davide Colombo" },
]
keywords = ["bioinformatics", "genomics", "blast", "assembly", "clustering", "alignment"]
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24,<3",
    "biopython>=1.80",
    "pyfaidx>=0.8",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://nevelib-website.vercel.app/"
Repository = "https://github.com/davide-colombo/nevelib"
Issues = "https://github.com/davide-colombo/nevelib/issues"

[project.optional-dependencies]
confirm = ["pysam>=0.22"]
viz = ["matplotlib>=3.9", "seaborn>=0.13"]
all = ["nevelib[confirm,viz]"]
dev = [
    "nevelib[all]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
nevelib-reads = "nevelib.reads.cli:main"
nevelib-assembly = "nevelib.assembly.cli:main"
nevelib-search = "nevelib.search.cli:main"
nevelib-clustering = "nevelib.clustering.cli:main"
nevelib-msa = "nevelib.msa.cli:main"
nevelib-mapping = "nevelib.mapping.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nevelib"]

[tool.hatch.build.targets.wheel.force-include]
"src/nevelib/reads/config.sample.yaml" = "nevelib/reads/config.sample.yaml"
"src/nevelib/assembly/config.sample.yaml" = "nevelib/assembly/config.sample.yaml"
"src/nevelib/search/config.sample.yaml" = "nevelib/search/config.sample.yaml"
"src/nevelib/clustering/config.sample.yaml" = "nevelib/clustering/config.sample.yaml"
"src/nevelib/msa/config.sample.yaml" = "nevelib/msa/config.sample.yaml"
"src/nevelib/mapping/config.sample.yaml" = "nevelib/mapping/config.sample.yaml"

[tool.pytest.ini_options]
testpaths = ["src/nevelib/tests"]
